<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Treino Hard">
<meta name="theme-color" content="#0a0a0a">
<title>Treino Hard (Fofo)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo.png">
<link rel="apple-touch-icon-precomposed" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<link rel="shortcut icon" href="logo.png">
<style>
  :root{
    /* Tema "Treino Hard (Fofo)" — preto + rosa empoeirado, conforme a logo */
    --bg:#0a0a0a; --elev:#161217; --card:#1a151a; --card2:#231a21; --border:#5b4554;
    --control-border:#806573; --text:#f6eef1; --muted:#bba9b3; --dim:#9d8b95;
    --red:#d96d8f; --reddim:#5e2738; --purple:#cf7a9a; --purpdim:#4a2233;
    --orange:#d9a066; --orangedim:#574021; --green:#22c55e; --greendim:#0f3d22;
    --yellow:#e8c08a; --blue:#b07d90; --bluedim:#3a2730;
    --shadow:0 6px 20px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{padding-bottom:130px}
  body.modal-open{overflow:hidden}
  .app{max-width:760px;margin:0 auto}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font:inherit}
  [hidden]{display:none!important}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #f6b2c8;outline-offset:3px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0}
  ::selection{background:var(--purple);color:#fff}

  /* HERO (scrolls away) */
  .hero{padding:calc(18px + env(safe-area-inset-top)) 16px 6px;
    background:radial-gradient(120% 90% at 100% 0%, rgba(217,109,143,.18), transparent 60%),
               radial-gradient(120% 90% at 0% 0%, rgba(217,109,143,.10), transparent 55%);}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:54px;height:54px;border-radius:15px;flex:0 0 auto;overflow:hidden;
    background:#0c0a0b;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:28px}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .brand .sub{color:var(--muted);font-weight:600;font-size:12.5px;margin-top:1px}

  /* Week selector */
  .weekwrap{padding:14px 16px 6px}
  .wlbl{color:var(--dim);font-size:10px;font-weight:800;
    text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
  .weekbar{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .week{padding:10px 2px;min-height:44px;border-radius:11px;
    background:var(--card);border:1px solid var(--control-border);color:var(--muted);
    font-weight:800;font-size:13px;text-align:center;transition:.15s}
  .week:active{transform:scale(.94)}
  .week.on{background:linear-gradient(135deg,var(--red),#c55f82);
    border-color:transparent;color:#1a0d12;box-shadow:0 3px 12px rgba(217,109,143,.4)}
  .week.dl.on{background:linear-gradient(135deg,var(--orange),#c28b50);
    color:#1a0d12;box-shadow:0 3px 12px rgba(217,160,102,.4)}
  .sessionbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .session{padding:10px;min-height:44px;border-radius:11px;background:var(--card);border:1px solid var(--control-border);
    color:var(--muted);font-weight:800;font-size:13px;transition:.15s}
  .session:active{transform:scale(.97)}
  .session.on{background:var(--purpdim);border-color:var(--purple);color:#fff}

  /* Week summary */
  .wsum{margin:12px 16px 4px;background:var(--elev);border:1px solid var(--border);
    border-radius:16px;padding:14px;display:flex;gap:8px;box-shadow:var(--shadow)}
  .wcell{flex:1;text-align:center;padding:0 4px}
  .wcell+.wcell{border-left:1px solid var(--border)}
  .wcell .lbl{color:var(--dim);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .wcell .big{font-size:24px;font-weight:900;color:var(--red);margin-top:3px;line-height:1}
  .wsum.dl .wcell .big{color:var(--orange)}
  .wcell .val{font-size:17px;font-weight:800;margin-top:4px}
  .deloadnote{margin:8px 16px 0;background:rgba(217,160,102,.12);border:1px solid var(--orangedim);
    border-radius:12px;padding:10px 12px;color:#e6c08a;font-size:12.5px;font-weight:600;line-height:1.45}
  .statusmsg{margin:8px 16px 0;border-radius:12px;padding:10px 12px;font-size:12.5px;
    font-weight:700;line-height:1.45;background:rgba(239,68,68,.1);border:1px solid #6b2525;color:#fecaca}
  .statusmsg.ok{background:rgba(34,197,94,.1);border-color:var(--greendim);color:#bbf7d0}
  .statusmsg button{display:inline-block;margin-top:7px;padding:7px 10px;border-radius:9px;
    background:var(--card);border:1px solid currentColor;font-weight:800}
  .appnotice{margin:10px 16px 0;padding:11px 12px;border:1px solid var(--control-border);border-radius:13px;
    background:var(--elev);display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:750}
  .appnotice.update{border-color:var(--purple);color:#f5cfdd}.appnotice.offline{border-color:var(--orangedim);color:#fde2b8}
  .appnotice button{margin-left:auto;min-height:38px;padding:7px 11px;border-radius:10px;background:var(--purple);color:#fff;font-weight:850}

  /* Tabs — STICKY */
  .tabsnav{position:sticky;top:0;z-index:40;margin-top:10px;
    background:rgba(10,10,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border)}
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 16px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;padding:9px 15px;min-height:44px;border-radius:999px;background:var(--card);
    border:1px solid var(--control-border);color:var(--muted);font-weight:700;font-size:13.5px;transition:.15s}
  .tab:active{transform:scale(.95)}
  .tab.on{background:var(--red);border-color:var(--red);color:#1a0d12}
  .tab.alg.on{background:var(--purple);border-color:var(--purple);color:#1a0d12}
  .tab.evol.on{background:var(--green);border-color:var(--green);color:#06250f}
  .tab.ciclo.on{background:var(--orange);border-color:var(--orange);color:#1a0d12}

  .panel{display:none;padding:16px 16px 0}
  .panel.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ptitle{font-size:21px;font-weight:800;letter-spacing:-.3px;margin:0}
  .psub{color:var(--muted);font-size:12.5px;margin-top:2px}

  /* progress bar */
  .prog{height:7px;border-radius:99px;background:var(--card);overflow:hidden;margin:11px 0 14px;border:1px solid var(--border)}
  .prog > i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--green),#16a34a);transition:width .35s ease}
  .progtxt{color:var(--dim);font-size:11px;font-weight:700;margin:-9px 0 14px}
  .progtxt .warn{color:#fde68a}
  .workoutfinish{width:100%;min-height:48px;margin:-2px 0 14px;padding:11px 14px;border-radius:12px;
    border:1px solid var(--green);background:rgba(34,197,94,.09);color:#bbf7d0;font-weight:900}
  .workoutfinish.on{background:var(--green);color:#06250f}.workoutfinish:active{transform:scale(.99)}

  /* CARD */
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:14px;margin-bottom:11px;border-left:3px solid var(--border);
    box-shadow:var(--shadow);transition:.2s}
  .card.k-mob{border-left-color:var(--purple)}
  .card.k-warm{border-left-color:var(--blue)}
  .card.k-per{border-left-color:var(--red)}
  .card.k-fix{border-left-color:var(--orange)}
  .card.done{border-left-color:var(--green);background:linear-gradient(180deg,rgba(34,197,94,.08),transparent)}
  .chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .cname{font-size:16.5px;font-weight:800;line-height:1.18;margin:0}
  .card.done .cname{color:#86efac}
  .cdetail{color:var(--muted);font-size:12.5px;margin-top:3px}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .badge{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;
    text-transform:uppercase;letter-spacing:.3px}
  .b-new{background:var(--reddim);color:#fecaca}
  .b-mob{background:var(--purpdim);color:#f5cfdd}
  .b-warm{background:var(--bluedim);color:#e3c4cf}
  .b-per{background:var(--reddim);color:#f0b6cc}
  .b-logwarn{background:#4a3a08;color:#fde68a}
  .donebtn{flex:0 0 auto;padding:9px 13px;border-radius:999px;background:var(--card2);
    border:1px solid var(--control-border);color:var(--muted);font-weight:800;font-size:12.5px;min-height:44px;
    align-self:flex-start;transition:.15s}
  .donebtn:active{transform:scale(.93)}
  .donebtn.on{background:var(--green);border-color:var(--green);color:#06250f}

  .target{background:var(--card2);border-radius:12px;padding:10px 12px;margin:12px 0 10px;
    display:flex;align-items:center;gap:10px}
  .target .ico{font-size:17px}
  .target .t1{color:var(--dim);font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
  .target .t2{font-weight:800;margin-top:1px;font-size:15.5px}
  .target.dl{background:rgba(217,160,102,.1)}
  .target.dl .t2{color:#e6c08a}

  .vbtn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;
    background:var(--card2);border:1px solid var(--control-border);border-radius:12px;
    color:var(--text);font-weight:700;font-size:13.5px;margin-bottom:10px;text-align:left;transition:.15s}
  .vbtn:active{transform:scale(.985);background:#22222a}
  .vplay{width:30px;height:30px;border-radius:9px;background:#ff0000;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .vbtn .vs{color:var(--dim);font-size:11px;font-weight:500;display:block;margin-top:1px}
  .vbtn .vquality{display:inline-block;margin-top:4px;padding:2px 6px;border-radius:999px;
    background:rgba(94,200,120,.12);color:#9be6ad;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.35px}
  .vbtn .vreason{color:var(--dim);font-size:10px;font-weight:500;margin-left:5px}
  .vbtn .ext{margin-left:auto;color:var(--dim);font-size:15px}
  .variantbox{margin:11px 0;padding:10px;border:1px solid var(--control-border);border-radius:12px;background:#100e13}
  .variantlabel{display:block;margin-bottom:7px;color:var(--dim);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.4px}
  .variantbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .variantbtn{min-height:44px;padding:8px;border:1px solid var(--control-border);border-radius:10px;background:var(--card2);color:var(--muted);font-size:12px;font-weight:850}
  .variantbtn.on{border-color:var(--purple);background:var(--purpdim);color:#fff}
  .variantnote{margin:7px 1px 0;color:var(--dim);font-size:10.5px;line-height:1.4}
  /* Player de vídeo (modal — toca dentro do app) */
  .vmodal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:100;display:none;
    flex-direction:column;align-items:center;justify-content:center;padding:16px}
  .vmodal.on{display:flex}
  .vmodal video{width:100%;max-width:680px;max-height:74vh;border-radius:14px;background:#000}
  .vmodal iframe{width:100%;max-width:680px;aspect-ratio:16/9;border:0;border-radius:14px;background:#000}
  .vmodal .vct{margin-top:10px;color:var(--text);font-size:14px;font-weight:800;text-align:center}
  .vrow{display:flex;gap:10px;margin-top:14px}
  .vmodal .vclose{padding:12px 24px;min-height:44px;border-radius:12px;background:var(--card);
    border:1px solid var(--control-border);color:var(--text);font-weight:800;font-size:14px;text-decoration:none}

  .notes{margin:2px 0 0;padding:0;list-style:none}
  .notes li{color:var(--muted);font-size:12px;line-height:1.55}

  /* Feedback pessoal por exercício */
  .feedback{margin-top:12px;border:1px solid var(--control-border);border-radius:12px;background:#100e13;overflow:hidden}
  .feedback summary{min-height:44px;padding:11px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;
    color:var(--muted);font-size:12.5px;font-weight:800;list-style:none}
  .feedback summary::-webkit-details-marker{display:none}
  .feedback summary::after{content:'+';margin-left:auto;color:var(--dim);font-size:17px}
  .feedback[open] summary::after{content:'−'}
  .feedback.flagged{border-color:#b45309}.feedback.pain{border-color:#ef4444}
  .feedbackbody{padding:0 12px 12px;border-top:1px solid var(--border)}
  .feedbackhint{margin:10px 0 8px;color:var(--dim);font-size:11.5px;line-height:1.45}
  .feelbar{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .feelbtn{min-height:44px;padding:8px;border-radius:10px;border:1px solid var(--control-border);
    background:var(--card2);color:var(--muted);font-size:12px;font-weight:800}
  .feelbtn.on{border-color:var(--purple);background:#251735;color:#fff}
  .feelbtn.pain.on{border-color:#ef4444;background:#351217}.feelbtn.replace.on{border-color:#f59e0b;background:#33200c}
  .feedbacklabel{display:block;margin:10px 0 5px;color:var(--dim);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .feedbacktext{width:100%;min-height:76px;resize:vertical;padding:10px 11px;border-radius:10px;
    border:1px solid var(--control-border);background:var(--bg);color:var(--text);font:inherit;font-size:16px;line-height:1.4}
  .feedbacktext:focus{outline:none;border-color:var(--purple)}
  .feedbackmsg{margin:8px 0 0;color:#fde68a;font-size:11.5px;line-height:1.45}
  .feedbackmsg.danger{color:#fca5a5}
  .reviewitem{padding:10px 0;border-bottom:1px solid var(--border)}
  .reviewitem:last-child{border-bottom:0}.reviewitem strong{display:block;font-size:13px}
  .reviewitem span{display:block;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.45}

  /* Set rows */
  .sets{display:flex;flex-direction:column;gap:7px;margin-top:6px}
  .srow{display:flex;align-items:center;gap:9px}
  .stag{width:30px;height:40px;border-radius:9px;background:var(--red);
    color:#fff;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .stag.warm{background:var(--blue)}.stag.fix{background:var(--orange)}
  .field{flex:1;position:relative}
  .sin{width:100%;height:46px;background:var(--bg);border:1.5px solid var(--control-border);
    border-radius:11px;color:var(--text);text-align:center;font-size:17px;font-weight:700;
    padding:0 6px 0 6px;transition:.15s}
  .sin:focus{outline:none;border-color:var(--purple);background:#16121d}
  .funit{position:absolute;right:9px;top:50%;transform:translateY(-50%);
    color:var(--dim);font-size:11px;font-weight:700;pointer-events:none}
  .sx{color:var(--dim);font-weight:800;font-size:14px}
  .setshd{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 6px}
  .setshd .lab{color:var(--dim);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .setshd .goal{color:#f5cfdd;font-size:12px;font-weight:800;
    background:rgba(207,122,154,.16);padding:4px 11px;border-radius:999px;border:1px solid var(--purpdim)}
  .setshd .goal.dl{color:#e6c08a;background:rgba(217,160,102,.14);border-color:var(--orangedim)}
  .prevref{margin:0 2px 8px;color:var(--muted);font-size:11.5px;font-weight:600;
    background:rgba(207,122,154,.08);border:1px dashed var(--bluedim);border-radius:9px;padding:7px 11px}
  .prevref b{color:#e0a3b8;font-weight:800}
  .quickrow{display:flex;flex-wrap:wrap;gap:7px;margin:0 2px 9px}
  .quickbtn{min-height:38px;padding:7px 10px;border:1px solid var(--control-border);border-radius:10px;
    background:var(--card2);color:var(--muted);font-size:11.5px;font-weight:800}
  .quickbtn.undo{border-color:var(--purple);color:#f5cfdd}
  .todaybadge{margin-left:7px;font-size:8.5px;font-weight:900;background:var(--green);color:#06250f;
    padding:2px 6px;border-radius:999px;letter-spacing:.4px;vertical-align:middle}

  .restbtn{width:100%;padding:12px;border-radius:12px;background:rgba(207,122,154,.14);
    min-height:44px;color:#f0b6cc;font-weight:800;font-size:13.5px;margin-top:12px;border:1px solid var(--control-border);transition:.15s}
  .restbtn:active{transform:scale(.985);background:rgba(207,122,154,.22)}

  /* Mobility check */
  .mc{width:100%;padding:12px;min-height:44px;border-radius:11px;background:var(--card2);border:1px solid var(--control-border);
    color:var(--muted);font-weight:800;font-size:13.5px;text-align:center;margin-top:10px;transition:.15s}
  .mc:active{transform:scale(.985)}
  .mc.on{background:var(--purpdim);border-color:var(--purple);color:#f9d8e4}

  /* Stretch cards */
  .stcard{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:14px;margin-bottom:11px;border-left:3px solid var(--purple);box-shadow:var(--shadow)}
  .stname{font-weight:800;font-size:16px;margin:0}
  .sttag{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:999px;
    margin-left:7px;vertical-align:middle;text-transform:uppercase;letter-spacing:.3px}
  .sttag.a{background:var(--purpdim);color:#f5cfdd}
  .sttag.f{background:#4a3a08;color:#fde68a}
  .stmeta{color:var(--muted);font-size:12px;margin-top:3px}
  .stopts{display:flex;gap:7px;margin-top:10px}
  .stopt{flex:1;padding:10px;min-height:44px;border-radius:10px;background:var(--bg);border:1.5px solid var(--control-border);
    color:var(--muted);font-weight:800;text-align:center;font-size:13px;transition:.15s}
  .stopt.on{background:var(--purpdim);border-color:var(--purple);color:#fff}
  .strun{width:100%;padding:12px;border-radius:11px;
    background:linear-gradient(135deg,#a83a5a,#7f2f49);color:#fff;
    min-height:44px;font-weight:800;margin-top:9px;font-size:14px;transition:.15s}
  .strun:active{transform:scale(.985)}

  .info{background:var(--elev);border-radius:14px;padding:13px;margin-bottom:11px;
    border-left:3px solid var(--purple)}
  .info.flex{border-left-color:var(--yellow)}
  .info b{display:block;margin-bottom:4px;font-size:14px}
  .info p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55}

  /* Peso e medidas */
  .tab.medidas.on{background:var(--blue);border-color:var(--blue);color:#1a0d12}
  .measureform,.measureblock{background:var(--elev);border:1px solid var(--border);border-radius:16px;padding:14px;margin:14px 0 11px;box-shadow:var(--shadow)}
  .measuregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .measurefield{display:block;min-width:0}.measurefield.full{grid-column:1/-1}
  .measuregroup{grid-column:1/-1;border:1px solid var(--border);border-radius:13px;padding:11px;margin:0;min-width:0;background:rgba(255,255,255,.015)}
  .measuregroup legend{padding:0 6px;color:#f0b6cc;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.45px}
  .measuregroup .measuregrid{margin-top:2px}
  .measurefield span{display:block;color:var(--dim);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .measureinput{width:100%;min-height:46px;border-radius:11px;border:1.5px solid var(--control-border);background:var(--bg);color:var(--text);padding:10px 11px;font:inherit;font-size:16px}
  .measureinput:focus{outline:3px solid #f6b2c8;outline-offset:2px}
  textarea.measureinput{min-height:72px;resize:vertical;line-height:1.4}
  .measureactions{display:flex;align-items:center;gap:10px;margin-top:12px}.measureactions .toolbtn{margin:0;flex:1}
  .measurehint{margin:9px 0 0;color:var(--dim);font-size:11.5px;line-height:1.5}.measurehint a{color:#f0b6cc}

// Descanso conforme a periodização, igual pra todos os exercícios:
// S1-S4 = 1:30 (90s) · S5-S7 = 2:00 (120s) · Deload = 1:30
function restSec(exObj,week){
  return (week>=5 && week<=7) ? 120 : 90;
}
function restLabel(s){ const m=Math.floor(s/60), sec=s%60; return m+':'+String(sec).padStart(2,'0'); }

function targetFor(exObj,week){
  // Mobilidade/alongamento NUNCA muda (OBS 2 da ficha)
  if(exObj.kind==='mob') return {sets:exObj.sets, reps:exObj.reps, deload:false};
  // Deload (S8): TODOS os exercícios de força viram 3×10 com ~50% da carga (literal da ficha)
  if(week===8) return {sets:3, reps:'10', deload:true};
  // Periodizados seguem a faixa da semana; aquecimento/acessório ficam fixos
  if(exObj.kind==='per') return {sets:3, reps:PERIOD_REPS[week], deload:false};
  return {sets:exObj.sets, reps:exObj.reps, deload:false};
}

function dayContext(dt=new Date()){
  const day=dt.getDay();

    key:dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),

}

// Acha a execução mais recente com séries de trabalho registradas.
function prevReference(exId,week,warmN=0){
  const candidates=[];
  if(state.session===2){
    candidates.push({week,session:1});
  }
  for(let w=week-1; w>=1; w--){
    candidates.push({week:w,session:2},{week:w,session:1});
  }
  for(const c of candidates){
    const en=readEntry(c.week,exId,c.session);
    if(en.sets.slice(warmN).some(hasSetData)){
      return {week:c.week,session:c.session,sets:en.sets};
    }
  }
  return null;
}
function hasSetData(s){
  return !!(s && (String(s.kg??'').trim()!=='' || String(s.reps??'').trim()!==''));
}

const EXERCISE_VARIANTS=new Map(WORKOUTS.flatMap(w=>w.exercises.filter(e=>e.variants.length).map(e=>[e.id,new Set(e.variants.map(v=>v.id))])));
const VALID_FEELINGS=new Set(['good','awkward','pain','replace']);

function sanitizeFeedback(value){
  return String(value??'').replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\s+/g,' ').trim().slice(0,240);
}
function normalizeStoredField(field,value){
  if(value==null || value==='') return '';
  let s=String(value).trim().replace(',','.');
  if(field==='kg'&&s.startsWith('.')) s='0'+s;
  if(field==='kg'&&s.endsWith('.')) s=s.slice(0,-1);
  return (field==='kg' ? /^\d{1,4}(?:\.\d{1,2})?$/ : /^\d{1,3}$/).test(s) ? s : '';
}
function sanitizeInput(field,value){
  let s=String(value??'').replace(',','.');
  if(field==='reps') return s.replace(/\D/g,'').slice(0,3);
  s=s.replace(/[^\d.]/g,'');
  if(s.startsWith('.')) s='0'+s;
  const dot=s.indexOf('.');
  if(dot>=0) s=s.slice(0,dot+1)+s.slice(dot+1).replace(/\./g,'');
  const parts=s.split('.');
  return parts[0].slice(0,4)+(parts.length>1?'.'+parts[1].slice(0,2):'');
}
function normalizeEntry(raw,exId=''){
  if(!isRecord(raw)) return null;
  const sets=Array.isArray(raw.sets) ? raw.sets.slice(0,8).map(s=>({
    kg:normalizeStoredField('kg',isRecord(s)?s.kg:''),
    reps:normalizeStoredField('reps',isRecord(s)?s.reps:'')
  })) : [];
  const feeling=VALID_FEELINGS.has(raw.feeling)?raw.feeling:'';
  const feedback=sanitizeFeedback(raw.feedback);
  const feedbackAt=(feeling||feedback)?validIso(raw.feedbackAt):null;
  const variants=EXERCISE_VARIANTS.get(exId); let variant=variants&&variants.has(raw.variant)?raw.variant:'';
  if(!variant&&exId==='b_supino_inclinado'&&(raw.done===true||sets.some(hasSetData)||feeling||feedback)) variant='dumbbells';
  return {sets,done:raw.done===true,...(variant?{variant}:{}),...(feeling?{feeling}:{}),...(feedback?{feedback}:{}),...(feedbackAt?{feedbackAt}:{})};
}
function normalizeBucket(raw,stats){
  const out={}; if(!isRecord(raw)) return out;
  Object.keys(raw).forEach(id=>{
    if(!VALID_EXERCISE_IDS.has(id)){ stats.ignored++; return; }
    const en=normalizeEntry(raw[id],id);
    if(en){ out[id]=en; if(en.done||en.feeling||en.feedback||en.sets.some(hasSetData)) stats.entries++; }
    else stats.ignored++;
  });
  return out;
}
function normalizeData(raw){
  const out={},stats={entries:0,ignored:0,legacy:false};
  if(!isRecord(raw)) return {data:out,...stats,valid:false};
  const topKeys=Object.keys(raw); let recognizedWeeks=0;
  topKeys.forEach(key=>{
    const week=Number(key);
    if(!Number.isInteger(week)||week<1||week>8||!isRecord(raw[key])) stats.ignored++;
    else recognizedWeeks++;
  });
  for(let week=1;week<=8;week++){
    const wk=raw[week]; if(!isRecord(wk)) continue;
    const isV2=Object.prototype.hasOwnProperty.call(wk,'1') || Object.prototype.hasOwnProperty.call(wk,'2');
    if(isV2){
      out[week]={1:normalizeBucket(wk[1],stats),2:normalizeBucket(wk[2],stats)};
    }else{
      // Mantém a convenção da versão 1.2: o único registro legado vira o 1º treino.
      stats.legacy=true;
      out[week]={1:normalizeBucket(wk,stats),2:{}};
    }
  }
  return {data:out,...stats,valid:topKeys.length===0||recognizedWeeks>0};
}
function decodeData(raw,preserveCorrupt=false){
  if(!raw) return {data:{},entries:0,ignored:0,legacy:false,valid:true,needsSave:false};
  try{
    const parsed=JSON.parse(raw);
    const wrapped=isRecord(parsed) && Object.prototype.hasOwnProperty.call(parsed,'schemaVersion');
    const normalized=normalizeData(wrapped?parsed.data:parsed);
    if(!normalized.valid) throw new Error('estrutura inválida');
    return {...normalized,needsSave:!wrapped || parsed.schemaVersion!==DATA_SCHEMA || normalized.legacy};
  }catch(e){
    if(preserveCorrupt){
      storageSet(LS.recovery,JSON.stringify({savedAt:new Date().toISOString(),reason:String(e.message||e),raw}));
      showStatus('Os dados locais estavam corrompidos e foram preservados para recuperação. O app iniciou sem sobrescrever essa cópia.');
    }
    return {data:{},entries:0,ignored:0,legacy:false,valid:false,needsSave:false};
  }
}
function loadData(){ return decodeData(storageGet(LS.data),true); }
function encodedData(data){ return JSON.stringify({schemaVersion:DATA_SCHEMA,data}); }
function saveData(){ return storageSet(LS.data,encodedData(state.data)); }
function syncLatestData(){
  if(!storageHealthy) return;
  const raw=storageGet(LS.data); if(!storageHealthy) return;
  const latest=decodeData(raw,false);
  if(latest.valid) state.data=latest.data;
}
function validIso(value){
  return typeof value==='string' && !Number.isNaN(Date.parse(value)) ? new Date(value).toISOString() : null;
}
function normalizeSessionMeta(raw){
  const out={}; if(!isRecord(raw)) return out;
  for(let week=1;week<=8;week++){
    const wk=raw[week]; if(!isRecord(wk)) continue;
    for(let session=1;session<=2;session++){
      const bucket=wk[session]; if(!isRecord(bucket)) continue;
      WORKOUTS.forEach(w=>{
        const item=bucket[w.tid]; if(!isRecord(item)) return;
        const startedAt=validIso(item.startedAt),completedAt=validIso(item.completedAt),manualCompleted=completedAt&&item.manualCompleted===true;
        if(startedAt||completedAt){
          if(!out[week]) out[week]={1:{},2:{}};
          out[week][session][w.tid]={...(startedAt?{startedAt}:{}),...(completedAt?{completedAt}:{}),...(manualCompleted?{manualCompleted:true}:{})};
        }
      });
    }
  }
  return out;
}
function parseStoredJson(key,fallback){
  try{ const raw=storageGet(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; }
}
function normalizeArchives(raw){
  if(!Array.isArray(raw)) return [];
  return raw.map((item,index)=>{
    if(!isRecord(item)) return null;
    const normalized=normalizeData(item.data);
    if(!normalized.valid||normalized.entries===0) return null;
    return {
      id:String(item.id||('ciclo-'+index)).replace(/[^A-Za-z0-9_-]/g,'').slice(0,80)||('ciclo-'+index),
      startedAt:validIso(item.startedAt),endedAt:validIso(item.endedAt)||new Date().toISOString(),
      data:normalized.data,meta:normalizeSessionMeta(item.meta)
    };
  }).filter(Boolean);
}

function validMeasureDate(value){
  const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||'')); if(!match) return '';
  const y=Number(match[1]),m=Number(match[2]),d=Number(match[3]),date=new Date(y,m-1,d);
  return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d?match[0]:'';
}
function normalizeMeasureValue(value){
  const raw=String(value??'').trim().replace(',','.'); if(!raw||!/^\d{1,3}(?:\.\d{1,2})?$/.test(raw)) return '';
  const number=Number(raw); return Number.isFinite(number)&&number>0&&number<=500?String(Math.round(number*100)/100):'';
}
function normalizeMeasurement(raw,index=0){
  if(!isRecord(raw)) return null; const date=validMeasureDate(raw.date); if(!date) return null;
  const item={id:String(raw.id||('medida-'+date+'-'+index)).replace(/[^A-Za-z0-9_-]/g,'').slice(0,80)||('medida-'+date+'-'+index),date};
  Object.keys(BODY_METRICS).forEach(key=>{ const value=normalizeMeasureValue(raw[key]); if(value) item[key]=value; });
  const legacyArm=normalizeMeasureValue(raw.arm),legacyThigh=normalizeMeasureValue(raw.thigh);
  if(legacyArm){ if(!item.armLeft) item.armLeft=legacyArm; if(!item.armRight) item.armRight=legacyArm; }
  if(legacyThigh){ if(!item.thighLeft) item.thighLeft=legacyThigh; if(!item.thighRight) item.thighRight=legacyThigh; }
  if(!Object.keys(BODY_METRICS).some(key=>item[key])) return null;
  const note=String(raw.note||'').replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\s+/g,' ').trim().slice(0,160); if(note) item.note=note;
  item.savedAt=validIso(raw.savedAt)||new Date().toISOString(); return item;
}
function normalizeMeasurements(raw){
  if(!Array.isArray(raw)) return []; const byDate=new Map();
  raw.slice(0,500).forEach((entry,index)=>{ const item=normalizeMeasurement(entry,index); if(item) byDate.set(item.date,item); });
  return [...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.savedAt.localeCompare(b.savedAt));
}
function syncLatestMeasurements(){
  if(!storageHealthy) return; const latest=normalizeMeasurements(parseStoredJson(LS.measurements,[])); if(storageHealthy) state.measurements=latest;
}

}

const EMPTY_ENTRY = {sets:[],done:false,variant:'',feeling:'',feedback:''};
let fieldEditDraft=null,lastQuickEdit=null;
function selectedVariant(exObj,entry=EMPTY_ENTRY){
  if(!exObj||!exObj.variants||!exObj.variants.length) return null;
  return exObj.variants.find(v=>v.id===entry.variant)||exObj.variants.find(v=>v.id===exObj.defaultVariant)||exObj.variants[0];
}
// Leitura: nunca cria nada (evita inchar o backup só de abrir a tela)
function sessionBucket(week,session,create){
  const wk=state.data[week];
  if(!wk) return create ? (state.data[week]={1:{},2:{}})[session] : null;
  return wk[session] || (create ? (wk[session]={}) : null);
}
function readEntry(week,exId,session=state.session){
  const bucket=sessionBucket(week,session,false);
  return (bucket && bucket[exId]) ? bucket[exId] : EMPTY_ENTRY;
}
// Escrita: garante que a entrada exista antes de gravar
function ensureEntry(week,exId){
  const bucket=sessionBucket(week,state.session,true);
  const workout=EXERCISE_WORKOUT.get(exId);
  const exObj=workout&&workout.exercises.find(ex=>ex.id===exId);
  if(bucket[exId]){
    if(exObj&&exObj.variants.length&&!bucket[exId].variant) bucket[exId].variant=exObj.defaultVariant||exObj.variants.find(v=>!v.hidden)?.id||exObj.variants[0].id;
    return bucket[exId];
  }
  const entry=bucket[exId]={sets:[],done:false};
  if(exObj&&exObj.variants.length) entry.variant=exObj.defaultVariant||exObj.variants.find(v=>!v.hidden)?.id||exObj.variants[0].id;
  return entry;
}
function workoutMeta(week,session,tid,create=false){
  let wk=state.meta[week];
  if(!wk&&create) wk=state.meta[week]={1:{},2:{}};
  if(!wk) return null;
  let bucket=wk[session];
  if(!bucket&&create) bucket=wk[session]={};
  if(!bucket) return null;
  return bucket[tid] || (create ? (bucket[tid]={}) : null);
}
function touchWorkout(exId){
  const workout=EXERCISE_WORKOUT.get(exId); if(!workout) return;
  const meta=workoutMeta(state.week,state.session,workout.tid,true);
  if(!meta.startedAt) meta.startedAt=new Date().toISOString();
  saveAux();
}
function workLogStatus(exObj,entry,week=state.week){
  if(!entry.done) return 'pending';
  if(exObj.kind==='mob') return 'full';
  const target=targetFor(exObj,week),warmN=exObj.warm||0;
  const sets=entry.sets.slice(warmN,warmN+target.sets);
  const complete=sets.filter(s=>numericValue(s&&s.kg)!=null&&numericValue(s&&s.reps)!=null).length;
  if(complete===target.sets) return 'full';
  return complete===0?'unlogged':'partial';
}
function updateWorkoutCompleted(exId){
  const workout=EXERCISE_WORKOUT.get(exId); if(!workout) return;
  const meta=workoutMeta(state.week,state.session,workout.tid,true);
  if(!meta.startedAt) meta.startedAt=new Date().toISOString();
  const allDone=workout.exercises.every(ex=>readEntry(state.week,ex.id).done);
  if(allDone && !meta.completedAt){ meta.completedAt=new Date().toISOString(); delete meta.manualCompleted; }
  if(!allDone && meta.completedAt && !meta.manualCompleted) delete meta.completedAt;
  saveAux();
}
function finishWorkout(tid){
  const workout=WORKOUTS.find(w=>w.tid===tid); if(!workout) return false;
  const meta=workoutMeta(state.week,state.session,tid,true);
  if(meta.completedAt){
    if(!confirm('Reabrir este treino do dia? Os registros dos exercícios serão mantidos.')) return false;
    delete meta.completedAt; delete meta.manualCompleted; saveAux(); render('finish-'+tid); return true;
  }
  const done=workout.exercises.filter(ex=>readEntry(state.week,ex.id).done).length;
  if(done<workout.exercises.length&&!confirm(`Finalizar o treino do dia com ${done} de ${workout.exercises.length} exercícios marcados? Os exercícios não marcados continuarão assim.`)) return false;
  if(!meta.startedAt) meta.startedAt=new Date().toISOString();
  meta.completedAt=new Date().toISOString(); meta.manualCompleted=true; saveAux(); render('finish-'+tid); return true;
}
function setVal(week,exId,i,field,val){

function beginFieldEdit(exId,i,field){

function commitFieldEdit(exId,i,field,value){
  if(!fieldEditDraft||fieldEditDraft.exId!==exId||fieldEditDraft.i!==i||fieldEditDraft.field!==field) return false;
  const after=sanitizeInput(field,value);
  const changed=fieldEditDraft.before!==after;
  if(changed) lastQuickEdit={type:'field',...fieldEditDraft,after};
  fieldEditDraft=null; return changed;
}
function copyPreviousSets(exId,warmN,count){
  syncLatestData(); const prev=prevReference(exId,state.week,warmN); if(!prev){ alert('Ainda não há uma execução anterior para copiar.'); return; }
  const entry=ensureEntry(state.week,exId),indices=Array.from({length:count},(_,j)=>warmN+j);
  if(indices.some(i=>hasSetData(entry.sets[i]))&&!confirm('Substituir os valores já preenchidos pelas séries anteriores?')) return;
  const before=indices.map(i=>({...entry.sets[i]||{kg:'',reps:''}}));
  indices.forEach(i=>{ const source=prev.sets[i]||{}; entry.sets[i]={kg:normalizeStoredField('kg',source.kg),reps:normalizeStoredField('reps',source.reps)}; });
  lastQuickEdit={type:'batch',week:state.week,session:state.session,exId,indices,before};
  touchWorkout(exId); if(saveData()) storageRemove(LS.snapshot); render();
}
function repeatFirstWorkSet(exId,warmN,count){
  syncLatestData(); const entry=ensureEntry(state.week,exId),source=entry.sets[warmN];
  if(!hasSetData(source)){ alert('Preencha a primeira série de trabalho antes de repetir.'); return; }
  const indices=Array.from({length:Math.max(0,count-1)},(_,j)=>warmN+j+1);
  if(indices.some(i=>hasSetData(entry.sets[i]))&&!confirm('Substituir as demais séries pelos valores da primeira?')) return;
  const before=indices.map(i=>({...entry.sets[i]||{kg:'',reps:''}}));
  indices.forEach(i=>entry.sets[i]={kg:String(source.kg??''),reps:String(source.reps??'')});
  lastQuickEdit={type:'batch',week:state.week,session:state.session,exId,indices,before};
  touchWorkout(exId); if(saveData()) storageRemove(LS.snapshot); render();
}
function undoQuickEdit(){
  const edit=lastQuickEdit; if(!edit) return;
  state.week=edit.week; state.session=edit.session; storageSet(LS.week,state.week); storageSet(LS.session,state.session);
  syncLatestData(); const entry=ensureEntry(edit.week,edit.exId);
  if(edit.type==='field'){
    if(!entry.sets[edit.i]) entry.sets[edit.i]={kg:'',reps:''}; entry.sets[edit.i][edit.field]=edit.before;
  }else edit.indices.forEach((index,pos)=>entry.sets[index]={...edit.before[pos]});
  lastQuickEdit=null; saveData(); render(); showStatus('Último preenchimento desfeito.','ok');
}
function toggleDone(week,exId){
  syncLatestData(); const e=ensureEntry(week,exId),workout=EXERCISE_WORKOUT.get(exId);
  const exObj=workout&&workout.exercises.find(ex=>ex.id===exId);
  if(!e.done&&exObj&&exObj.kind!=='mob'){
    const target=targetFor(exObj,week),warmN=exObj.warm||0;
    const complete=e.sets.slice(warmN,warmN+target.sets)
      .filter(s=>numericValue(s&&s.kg)!=null&&numericValue(s&&s.reps)!=null).length;
    if(complete<target.sets){
      const message=complete===0
        ?'Marcar como feito sem registrar carga e repetições? O progresso indicará “sem registro”.'
        :`Há apenas ${complete} de ${target.sets} séries completas. Marcar como feito com registro parcial?`;
      if(!confirm(message)) return false;

  if(saveData()) storageRemove(LS.snapshot);
  updateWorkoutCompleted(exId); return true;
}

    (feeling==='pain'?`<p class="feedbackmsg danger">Dor é um sinal para interromper o movimento e buscar avaliação profissional se persistir ou for intensa.</p>`:

    `</div></details>`;

  const kindClass='k-'+exObj.kind;
  return `<article class="card ${kindClass} ${done?'done':''}">`+
    `<div class="chead"><div>`+
      `<h3 class="cname">${esc(displayEx.name)}</h3>`+

    `</div>`+
    body+
    (exObj.kind!=='mob'?`<button type="button" class="restbtn" onclick="startTimer(${restSec(exObj,week)},'Descanso · ${displayEx.name.replace(/'/g,'')}')">⏱ Descanso ${rl}</button>`:'')+

function numericValue(value){
  const n=Number(String(value??'').trim().replace(',','.'));
  return Number.isFinite(n)&&n>0?n:null;
}
function formatNumber(value,decimals=1){
  if(value==null||!Number.isFinite(value)) return '—';
  const rounded=Math.round(value*10**decimals)/10**decimals;
  return (Number.isInteger(rounded)?String(rounded):rounded.toFixed(decimals)).replace('.',',');
}
function formatDateTime(value){
  const iso=validIso(value); if(!iso) return '';
  return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso));
}
function entryCount(data){ return normalizeData(data).entries; }

function feedbackReviewItems(){
  const latest=new Map();
  for(let week=1;week<=8;week++) for(let session=1;session<=2;session++){
    const bucket=state.data[week]&&state.data[week][session]; if(!bucket) continue;
    Object.entries(bucket).forEach(([exId,entry])=>{
      if(!entry || (!entry.feeling&&!entry.feedback)) return;
      latest.set(exId,{exId,week,session,feeling:entry.feeling||'',feedback:entry.feedback||'',feedbackAt:entry.feedbackAt||''});
    });
  }
  return orderedWorkouts().flatMap(workout=>workout.exercises.map(exObj=>{
    const item=latest.get(exObj.id);
    return item?{...item,workout,exObj}:null;
  }).filter(Boolean));
}
function feedbackReportText(){
  const items=feedbackReviewItems();

  items.forEach(item=>{
    lines.push(`Treino ${item.workout.label} · ${item.exObj.name}${item.exObj.detail?' · '+item.exObj.detail:''}`);

function backupMessage(){
  if(entryCount(state.data)===0) return '';
  const last=validIso(storageGet(LS.lastBackup));
  if(!last) return 'Nenhum backup exportado neste aparelho.';
  const days=Math.floor((Date.now()-Date.parse(last))/86400000);
  return days>=7?`Último backup há ${days} dias. Recomendamos exportar uma nova cópia.`:`Último backup: ${formatDateTime(last)}.`;
}
function normalizeAutoBackups(raw){

function evolutionPoints(exObj,metric=evolutionMetric){
  const points=[],warmN=exObj.warm||0;
  for(let week=1;week<=8;week++){
    for(let session=1;session<=2;session++){
      const entry=readEntry(week,exObj.id,session),sets=entry.sets.slice(warmN);
      const loads=sets.map(s=>numericValue(s&&s.kg)).filter(v=>v!=null);
      const reps=sets.map(s=>numericValue(s&&s.reps)).filter(v=>v!=null);
      const pairs=sets.map(s=>({kg:numericValue(s&&s.kg),reps:numericValue(s&&s.reps)}))
        .filter(s=>s.kg!=null&&s.reps!=null);
      const maxKg=loads.length?Math.max(...loads):null;
      const volume=pairs.length?pairs.reduce((sum,s)=>sum+s.kg*s.reps,0):null;
      const totalReps=reps.length?reps.reduce((sum,v)=>sum+v,0):null;
      const variant=selectedVariant(exObj,entry),variantLabel=variant?(variant.short||variant.name):'';
      points.push({index:(week-1)*2+(session-1),week,session,label:`${WEEK_LABEL[week]} · ${session}º${variantLabel?' · '+variantLabel:''}`,
        maxKg,volume,totalReps,value:metric==='volume'?volume:maxKg});
    }
  }
  return points;
}
function evolutionChart(points,meta,exerciseName){
  const valid=points.filter(p=>p.value!=null);
  if(!valid.length) return `<div class="evoempty">Ainda não há dados suficientes para este gráfico.<br>Registre carga e repetições nas séries de trabalho.</div>`;
  const W=640,H=250,L=54,R=18,T=18,B=38,plotW=W-L-R,plotH=H-T-B;
  const highest=Math.max(...valid.map(p=>p.value)),ceiling=highest>0?highest*1.1:1;
  const x=i=>L+(i/15)*plotW,y=v=>T+plotH-(v/ceiling)*plotH;
  let grid='';
  for(let i=0;i<=4;i++){
    const gy=T+(i/4)*plotH,value=ceiling*(1-i/4);
    grid+=`<line class="chartgrid" x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}"></line>`+
      `<text class="chartaxis" x="${L-7}" y="${gy+3}" text-anchor="end">${formatNumber(value)}</text>`;
  }
  let labels='';
  for(let week=1;week<=8;week++){
    const lx=x((week-1)*2+.5);
    labels+=`<text class="chartaxis" x="${lx}" y="${H-10}" text-anchor="middle">${WEEK_LABEL[week]}</text>`;
  }
  const polyline=valid.map(p=>`${x(p.index)},${y(p.value)}`).join(' ');
  const circles=valid.map(p=>`<circle class="chartpoint" cx="${x(p.index)}" cy="${y(p.value)}" r="5" tabindex="0">`+
    `<title>${p.label}: ${formatNumber(p.value)} ${meta.unit}</title></circle>`).join('');
  const lastValid=valid[valid.length-1];
  const aria=`${meta.label} de ${exerciseName}. ${valid.length} registros. Último: ${formatNumber(lastValid.value)} ${meta.unit}.`;
  return `<svg class="evochart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">`+
    `<title>${esc(aria)}</title>${grid}${labels}<polyline class="chartline" points="${polyline}"></polyline>${circles}</svg>`;
}

function formatMeasureDate(value){

}
function measurementPoints(metric=bodyMetric){

function measurementChart(metric=bodyMetric){
  const meta=BODY_METRICS[metric],points=measurementPoints(metric);
  if(points.length<2) return `<div class="evoempty">Salve pelo menos dois registros de ${meta.short.toLowerCase()} para traçar a evolução.</div>`;
  const W=640,H=240,L=54,R=18,T=18,B=42,plotW=W-L-R,plotH=H-T-B;
  let min=Math.min(...points.map(p=>p.value)),max=Math.max(...points.map(p=>p.value));
  const pad=min===max?Math.max(1,min*.03):(max-min)*.14; min=Math.max(0,min-pad); max+=pad;

function isLocalVid(s){

// Extrai o ID do vídeo de URLs do YouTube (watch, shorts, youtu.be)
function ytId(u){
  try{
    const url=new URL(u),host=url.hostname.replace(/^(www\.|m\.)/,'');
    if(host==='youtu.be') return /^[A-Za-z0-9_-]{6,}$/.test(url.pathname.slice(1))?url.pathname.slice(1):null;
    if(host!=='youtube.com') return null;
    const id=url.pathname.startsWith('/shorts/')?url.pathname.split('/')[2]:url.searchParams.get('v');
    return /^[A-Za-z0-9_-]{6,}$/.test(id||'')?id:null;
  }catch(e){ return null; }
}

let modalReturnFocus=null;

function openVid(u,title){

        f=document.getElementById('vmframe'), ext=document.getElementById('vmext');

    f.hidden=true; f.src='about:blank'; ext.hidden=true;

    const play=v.play(); if(play&&play.catch) play.catch(()=>{});
  } else if(id){
    v.hidden=true; try{ v.pause(); }catch(e){} v.removeAttribute('src');
    f.hidden=false;
    f.src='https://www.youtube-nocookie.com/embed/'+id+'?playsinline=1&rel=0';

document.addEventListener('keydown',ev=>{
  const m=document.getElementById('vmodal'); if(!m.classList.contains('on')) return;

  if(ev.key!=='Tab') return;
  const focusable=[...m.querySelectorAll('a:not([hidden]),button:not([hidden])')]; if(!focusable.length) return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(ev.shiftKey&&document.activeElement===first){ ev.preventDefault(); last.focus(); }
  else if(!ev.shiftKey&&document.activeElement===last){ ev.preventDefault(); first.focus(); }
});

/* ====================== TIMER ====================== */
let tInt=null,tHide=null,tDeadline=0,tRem=0,tTotal=0,tFinished=false;
function startTimer(sec,label){
  primeAudio();
  clearInterval(tInt); clearTimeout(tHide); tHide=null;
  tRem=sec; tTotal=sec; tDeadline=Date.now()+sec*1000; tFinished=false;
  $('#tlbl').textContent=label||'Descanso';
  $('#timerbar').classList.add('on');
  $('#timerannounce').textContent='Cronômetro iniciado: '+restLabel(sec);
  tickTimer();
  vibrate([35]);
  tInt=setInterval(tickTimer,500);
}
function tickTimer(){
  if(tFinished) return;
  tRem=Math.max(0,Math.ceil((tDeadline-Date.now())/1000));
  paintTimer();
  if(tRem===0) finishTimer();
}
function finishTimer(){
  if(tFinished) return;
  tFinished=true; clearInterval(tInt); tInt=null; tRem=0; paintTimer(); doneBeep();
  $('#timerannounce').textContent='Tempo concluído.';
  tHide=setTimeout(()=>{ $('#timerbar').classList.remove('on'); tHide=null; },1800);
}
function paintTimer(){
  $('#tnum').textContent=restLabel(Math.max(0,tRem));
  const pct = tTotal>0 ? (tRem/tTotal*100) : 0;
  $('#tprog').style.width=pct+'%';
}
function timerAdd(){
  clearTimeout(tHide); tHide=null; $('#timerbar').classList.add('on');
  if(tFinished || tDeadline<=Date.now()){
    tTotal=30; tDeadline=Date.now()+30000; tFinished=false; tInt=setInterval(tickTimer,500);
  }else{
    tTotal+=30; tDeadline+=30000;
  }
  tickTimer(); $('#timerannounce').textContent='Trinta segundos adicionados.';
}
function timerStop(){
  clearInterval(tInt); clearTimeout(tHide); tInt=null; tHide=null; tFinished=true;
  $('#timerbar').classList.remove('on'); $('#timerannounce').textContent='Cronômetro parado.';
}

/* ====================== ÁUDIO / VIBRAÇÃO ====================== */
let audioCtx=null;
function primeAudio(){
  if(!state.settings.sound) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended'){ const p=audioCtx.resume(); if(p&&p.catch) p.catch(()=>{}); }
  }catch(e){}
}
function vibrate(p){ try{ if(state.settings.vibration&&navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function doneBeep(){
  vibrate([200,100,200]);
  if(!state.settings.sound) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const play=()=>{
      const ac=audioCtx;
      [0,0.2].forEach(off=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=880;
        o.start(ac.currentTime+off);
        g.gain.setValueAtTime(0.0001,ac.currentTime+off);
        g.gain.exponentialRampToValueAtTime(0.4,ac.currentTime+off+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+off+0.18);
        o.stop(ac.currentTime+off+0.2);
      });
    };
    if(audioCtx.state==='suspended'){
      const p=audioCtx.resume(); if(p&&p.then) p.then(play).catch(()=>{});
    }else play();
  }catch(e){}
}

function downloadText(text,name,type='application/json'){
  const blob=new Blob([text],{type}),a=document.createElement('a');

}

  const rows=[headers];
  const makeRow=values=>headers.map(header=>values[header]??'');
  for(let week=1;week<=8;week++) for(let session=1;session<=2;session++) orderedWorkouts().forEach(workout=>{
    const meta=workoutMeta(week,session,workout.tid,false),date=meta&&meta.startedAt?localDateStamp(new Date(meta.startedAt)):'';

  state.measurements.forEach(item=>rows.push(makeRow({tipo:'medida',data:item.date,peso_kg:item.weight||'',altura_cm:item.height||'',entrepernas_cm:item.inseam||'',
    pescoco_cm:item.neck||'',largura_ombros_cm:item.shoulderWidth||'',cintura_cm:item.waist||'',abdomen_cm:item.abdomen||'',peitoral_cm:item.chest||'',quadril_cm:item.hip||'',
    braco_esq_cm:item.armLeft||'',braco_dir_cm:item.armRight||'',antebraco_esq_cm:item.forearmLeft||'',antebraco_dir_cm:item.forearmRight||'',coxa_esq_cm:item.thighLeft||'',coxa_dir_cm:item.thighRight||'',
    panturrilha_esq_cm:item.calfLeft||'',panturrilha_dir_cm:item.calfRight||'',observacao:item.note||''})));
  downloadText('\uFEFF'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n'),'treino-hard-registros-'+localDateStamp()+'.csv','text/csv;charset=utf-8');
  showStatus('CSV exportado para consulta. Para restauração, use sempre o backup JSON.','ok');

function exportArchive(id){
  const archive=state.archives.find(item=>item.id===id); if(!archive) return;
  const payload={app:'treino-hard-fofo',schemaVersion:DATA_SCHEMA,exportedAt:new Date().toISOString(),
    archivedCycle:true,cycleStartedAt:archive.startedAt,data:archive.data,meta:archive.meta,archives:[]};
  downloadText(JSON.stringify(payload,null,2),'treino-hard-ciclo-'+localDateStamp(new Date(archive.endedAt))+'.json');
}
function createSnapshot(reason){
  const payload={app:'treino-hard-fofo',schemaVersion:DATA_SCHEMA,savedAt:new Date().toISOString(),reason,
    view:{week:state.week,session:state.session,tab:state.tab,evolutionExercise:evolutionExerciseId,evolutionMetric,bodyMetric},
    cycleStartedAt:state.cycleStartedAt,data:state.data,meta:state.meta,archives:state.archives,measurements:state.measurements,settings:state.settings};
  return storageSet(LS.snapshot,JSON.stringify(payload));
}
function autoBackupIfDue(force=false){
  if(entryCount(state.data)===0&&state.measurements.length===0) return false;
  const today=localDateStamp(),backups=getAutoBackups(),existing=backups.find(item=>item.day===today);
  if(existing&&!force) return false;
  syncLatestData(); syncLatestMeasurements(); const payload={...buildBackupPayload(),id:'auto-'+today,day:today,savedAt:new Date().toISOString(),reason:'Cópia automática local'};
  const next=[...backups.filter(item=>item.day!==today),payload].slice(-3);
  try{ localStorage.setItem(LS.autoBackups,JSON.stringify(next)); return true; }
  catch(e){ try{ localStorage.setItem(LS.autoBackups,JSON.stringify([payload])); return true; }catch(inner){ return false; } }
}
function restoreAutoBackup(id){
  const backup=getAutoBackups().find(item=>item.id===id); if(!backup) return;
  const normalized=normalizeData(backup.data),measurements=normalizeMeasurements(backup.measurements);
  if(!normalized.valid){ alert('Esta cópia local não passou na validação. Nada foi alterado.'); return; }
  if(!confirm(`Restaurar a cópia de ${formatDateTime(backup.savedAt)} com ${normalized.entries} registro(s) e ${measurements.length} medição(ões)?`)) return;
  syncLatestData(); syncLatestMeasurements(); if(!createSnapshot('Antes de restaurar cópia automática')){ alert('Não foi possível criar a cópia de desfazer. Restauração cancelada.'); return; }
  const previous={data:state.data,meta:state.meta,archives:state.archives,measurements:state.measurements,settings:state.settings,cycleStartedAt:state.cycleStartedAt};
  state.data=normalized.data; state.meta=normalizeSessionMeta(backup.meta); state.archives=normalizeArchives(backup.archives);
  state.measurements=measurements; state.settings=normalizeSettings(backup.settings); state.cycleStartedAt=validIso(backup.cycleStartedAt)||new Date().toISOString();
  if(!saveData()||!saveAux()||!saveMeasurements()||!storageSet(LS.settings,JSON.stringify(state.settings))){ Object.assign(state,previous); saveData();saveAux();saveMeasurements();storageSet(LS.settings,JSON.stringify(state.settings));alert('Não foi possível restaurar; os dados anteriores foram mantidos.');return; }
  document.body.classList.toggle('large-text',state.settings.largeText); render(); alert('Cópia automática restaurada. Você ainda pode desfazer em Ciclo.');
}
function importData(ev){
  const f=ev.target.files[0]; if(!f) return;
  if(f.size>2*1024*1024){ alert('Arquivo muito grande. O limite do backup é 2 MB.'); ev.target.value=''; return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(!isRecord(j) || j.app!=='treino-hard-fofo' || !Object.prototype.hasOwnProperty.call(j,'data')) throw new Error('Este arquivo não é um backup do Treino Hard.');
      if(Number(j.schemaVersion||1)>DATA_SCHEMA) throw new Error('Backup criado por uma versão mais nova do app.');
      const normalized=normalizeData(j.data);
      if(!normalized.valid) throw new Error('Estrutura de dados inválida.');
      const importedMeasurements=Array.isArray(j.measurements)?normalizeMeasurements(j.measurements):state.measurements;
      const importedArchives=Array.isArray(j.archives)?normalizeArchives(j.archives):state.archives;
      const origin=j.exportedAt?`\nCriado em: ${formatDateTime(j.exportedAt)||'data inválida'}`:'';
      const details=`${normalized.entries} registro(s), ${importedMeasurements.length} medição(ões) e ${importedArchives.length} ciclo(s) arquivado(s)`+(normalized.ignored?`\n${normalized.ignored} item(ns) inválido(s) serão ignorado(s)`:'' );
      if(!confirm(`Prévia do backup:\n${details}${origin}\n\nImportar? Os dados atuais serão substituídos, mas poderão ser desfeitos.`)) return;
      syncLatestData(); syncLatestMeasurements();
      if(!createSnapshot('Antes da importação')) throw new Error('Não foi possível criar a cópia de segurança. Importação cancelada.');
      const previous={data:state.data,meta:state.meta,archives:state.archives,measurements:state.measurements,settings:state.settings,cycleStartedAt:state.cycleStartedAt};
      state.data=normalized.data;
      state.meta=normalizeSessionMeta(j.meta);
      if(Array.isArray(j.archives)) state.archives=normalizeArchives(j.archives);
      if(Array.isArray(j.measurements)) state.measurements=normalizeMeasurements(j.measurements);
      if(isRecord(j.settings)) state.settings=normalizeSettings(j.settings);
      state.cycleStartedAt=validIso(j.cycleStartedAt)||new Date().toISOString();
      if(!saveData()||!saveAux()||!saveMeasurements()||!storageSet(LS.settings,JSON.stringify(state.settings))){
        state.data=previous.data;state.meta=previous.meta;state.archives=previous.archives;state.measurements=previous.measurements;state.settings=previous.settings;state.cycleStartedAt=previous.cycleStartedAt;
        saveData();saveAux();saveMeasurements();storageSet(LS.settings,JSON.stringify(state.settings));throw new Error('Não foi possível salvar o backup importado.');
      }
      if(isRecord(j.view)){
        state.week=clampWeek(j.view.week)||state.week;
        state.session=[1,2].includes(Number(j.view.session))?Number(j.view.session):state.session;
        state.tab=VALID_TABS.includes(j.view.tab)?j.view.tab:state.tab;
        if(STRENGTH_IDS.has(j.view.evolutionExercise)) evolutionExerciseId=j.view.evolutionExercise;
        if(Object.prototype.hasOwnProperty.call(EVOLUTION_METRICS,j.view.evolutionMetric)) evolutionMetric=j.view.evolutionMetric;
        if(Object.prototype.hasOwnProperty.call(BODY_METRICS,j.view.bodyMetric)) bodyMetric=j.view.bodyMetric;
      }
      storageSet(LS.week,state.week); storageSet(LS.session,state.session); storageSet(LS.tab,state.tab);
      storageSet(LS.evolutionExercise,evolutionExerciseId); storageSet(LS.evolutionMetric,evolutionMetric);
      storageSet(LS.bodyMetric,bodyMetric);
      document.body.classList.toggle('large-text',state.settings.largeText);
      render(); alert('Backup validado e importado com segurança.'+(normalized.legacy?' Os dados antigos foram convertidos para o 1º treino, mantendo a compatibilidade com a versão 1.2.':''));
    }catch(e){ alert(e.message||'Erro ao ler o arquivo. Nenhum dado foi alterado.'); }
  };
  r.onerror=()=>alert('Não foi possível ler o arquivo. Nenhum dado foi alterado.');
  r.readAsText(f);
  ev.target.value='';
}
function exportRecovery(){
  try{
    const saved=JSON.parse(storageGet(LS.recovery)||'null');
    if(!saved || typeof saved.raw!=='string') throw new Error();
    downloadText(saved.raw,'treino-hard-recuperacao-'+localDateStamp()+'.json','text/plain');
  }catch(e){ alert('Não há dados de recuperação disponíveis.'); }
}
function undoLastChange(){
  try{
    const snap=JSON.parse(storageGet(LS.snapshot)||'null');
    if(!snap || snap.app!=='treino-hard-fofo') throw new Error('Cópia de desfazer inválida.');
    const normalized=normalizeData(snap.data); if(!normalized.valid) throw new Error('Cópia de desfazer corrompida.');
    const previous={data:state.data,meta:state.meta,archives:state.archives,measurements:state.measurements,settings:state.settings,cycleStartedAt:state.cycleStartedAt};
    state.data=normalized.data;state.meta=normalizeSessionMeta(snap.meta);
    state.archives=normalizeArchives(snap.archives);
    if(Array.isArray(snap.measurements)) state.measurements=normalizeMeasurements(snap.measurements);
    if(isRecord(snap.settings)) state.settings=normalizeSettings(snap.settings);
    state.cycleStartedAt=validIso(snap.cycleStartedAt)||new Date().toISOString();
    if(!saveData()||!saveAux()||!saveMeasurements()||!storageSet(LS.settings,JSON.stringify(state.settings))){
      state.data=previous.data;state.meta=previous.meta;state.archives=previous.archives;state.measurements=previous.measurements;state.settings=previous.settings;state.cycleStartedAt=previous.cycleStartedAt;
      saveData();saveAux();saveMeasurements();storageSet(LS.settings,JSON.stringify(state.settings));throw new Error('Não foi possível restaurar os dados.');
    }
    if(isRecord(snap.view)){
      state.week=clampWeek(snap.view.week)||1;
      state.session=[1,2].includes(Number(snap.view.session))?Number(snap.view.session):1;
      state.tab=VALID_TABS.includes(snap.view.tab)?snap.view.tab:'b';
      if(STRENGTH_IDS.has(snap.view.evolutionExercise)) evolutionExerciseId=snap.view.evolutionExercise;
      if(Object.prototype.hasOwnProperty.call(EVOLUTION_METRICS,snap.view.evolutionMetric)) evolutionMetric=snap.view.evolutionMetric;
      if(Object.prototype.hasOwnProperty.call(BODY_METRICS,snap.view.bodyMetric)) bodyMetric=snap.view.bodyMetric;
    }
    storageSet(LS.week,state.week); storageSet(LS.session,state.session); storageSet(LS.tab,state.tab);
    storageSet(LS.evolutionExercise,evolutionExerciseId); storageSet(LS.evolutionMetric,evolutionMetric);
    storageSet(LS.bodyMetric,bodyMetric);
    document.body.classList.toggle('large-text',state.settings.largeText);
    storageRemove(LS.snapshot); render(); alert('Última alteração desfeita.');
  }catch(e){ alert(e.message||'Não foi possível desfazer.'); }
}
function resetWorkout(){
  if(confirm('Apagar TODOS os registros A, B e C do '+state.session+'º treino da semana '+WEEK_LABEL[state.week]+'? Você poderá desfazer depois.')){
    syncLatestData(); if(!createSnapshot('Antes de limpar uma ocorrência')){ alert('Não foi possível criar a cópia de segurança. Limpeza cancelada.'); return; }
    const previous=JSON.parse(JSON.stringify(state.data));
    const previousMeta=JSON.parse(JSON.stringify(state.meta));
    const bucket=sessionBucket(state.week,state.session,false);
    if(bucket) state.data[state.week][state.session]={};
    if(state.meta[state.week]) state.meta[state.week][state.session]={};
    if(!saveData()||!saveAux()){
      state.data=previous;state.meta=previousMeta;saveData();saveAux();
      alert('Não foi possível salvar a limpeza. Os dados foram mantidos.'); return;
    }
    render();
  }
}
function resetPeriodization(){
  if(!confirm('REINICIAR A PERIODIZAÇÃO DO ZERO? O ciclo atual será arquivado e o app voltará para S1, 1º treino, ficha A. Você poderá desfazer depois.')) return;
  syncLatestData(); if(!createSnapshot('Antes de reiniciar a periodização')){ alert('Não foi possível criar a cópia de segurança. Reinício cancelado.'); return; }
  const previous={data:state.data,meta:state.meta,archives:state.archives,cycleStartedAt:state.cycleStartedAt};
  const hadData=entryCount(state.data)>0;
  if(hadData){
    state.archives=[...state.archives,{id:'ciclo-'+Date.now(),startedAt:state.cycleStartedAt,
      endedAt:new Date().toISOString(),data:state.data,meta:state.meta}];
  }
  state.data={};state.meta={};state.cycleStartedAt=new Date().toISOString();
  if(!saveData()||!saveAux()){
    state.data=previous.data;state.meta=previous.meta;state.archives=previous.archives;state.cycleStartedAt=previous.cycleStartedAt;
    saveData();saveAux();alert('Não foi possível salvar o reinício. Os dados foram mantidos.');return;
  }
  state.week=1; state.session=1; state.tab='b';
  storageSet(LS.week,1); storageSet(LS.session,1); storageSet(LS.tab,'b');
  timerStop(); render(); window.scrollTo(0,0);
  alert(hadData?'Ciclo anterior arquivado. Você pode começar novamente pela S1, treino A.':'Periodização reiniciada. Você pode começar pela S1, treino A.');
}

/* ====================== UTIL ====================== */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ====================== APP / DISPOSITIVO ====================== */
let wakeLock=null,swRegistration=null,waitingWorker=null,reloadingForUpdate=false;
async function requestWakeLock(){
  if(!state.settings.keepAwake||document.hidden||!('wakeLock' in navigator)) return;
  try{ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null;}); }catch(e){}
}
function releaseWakeLock(){ if(wakeLock){ const lock=wakeLock; wakeLock=null; const p=lock.release(); if(p&&p.catch) p.catch(()=>{}); } }
async function requestPersistentStorage(){
  if(!navigator.storage||!navigator.storage.persist){ showStatus('Este navegador não oferece proteção adicional de armazenamento.'); return; }
  try{ const granted=await navigator.storage.persist(); showStatus(granted?'Proteção adicional ativada neste navegador.':'O navegador não concedeu proteção adicional; mantenha backups JSON. ',granted?'ok':'error'); }
  catch(e){ showStatus('Não foi possível solicitar a proteção adicional.'); }
}
function refreshAppNotice(){
  const el=document.getElementById('appnotice'); if(!el) return;
  if(waitingWorker){ el.className='appnotice update'; el.innerHTML='<span>✨ Uma nova versão está pronta.</span><button type="button" onclick="applyAppUpdate()">Atualizar agora</button>'; el.hidden=false; return; }
  if(navigator.onLine===false){ el.className='appnotice offline'; el.textContent='Sem conexão — seus registros locais continuam disponíveis.'; el.hidden=false; return; }
  el.hidden=true;
}
function offerAppUpdate(worker){ waitingWorker=worker; refreshAppNotice(); }
function watchRegistration(reg){
  swRegistration=reg; if(reg.waiting) offerAppUpdate(reg.waiting);
  reg.addEventListener('updatefound',()=>{ const worker=reg.installing; if(!worker) return; worker.addEventListener('statechange',()=>{ if(worker.state==='installed'&&navigator.serviceWorker.controller) offerAppUpdate(worker); }); });
}
function applyAppUpdate(){ if(waitingWorker) waitingWorker.postMessage({type:'SKIP_WAITING'}); }
async function checkForUpdates(){
  if(!swRegistration){ showStatus('A verificação estará disponível após o app concluir a inicialização.'); return; }
  if(navigator.onLine===false){ showStatus('Conecte-se à internet para procurar atualizações.'); return; }
  try{
    await swRegistration.update();
    const message=waitingWorker?'Nova versão pronta para instalar.':swRegistration.installing?'Atualização encontrada e sendo preparada.':'Você já está usando a versão mais recente.';
    showStatus(message,'ok'); refreshAppNotice();
  }
  catch(e){ showStatus('Não foi possível verificar atualizações agora.'); }
}
function advanceNumericField(ev){
  if(ev.key!=='Enter'||!ev.target.classList||!ev.target.classList.contains('sin')) return;
  ev.preventDefault(); const fields=[...document.querySelectorAll('.panel.on .sin')]; const index=fields.indexOf(ev.target);
  if(index>=0&&fields[index+1]) fields[index+1].focus(); else ev.target.blur();
}

/* ====================== INIT ====================== */
// No 1º acesso de cada dia, abre o treino de hoje (Seg=A…Sáb=C).
// Em reloads no mesmo dia, mantém a aba onde você estava.
function syncTodayWorkout(){
  const next=dayContext(),lastOpen=storageGet(LS.lastOpen),dayChanged=lastOpen!==next.key;
  currentDay=next; todayTid=next.tid; todaySession=next.session;
  if(todayTid && dayChanged){
    state.tab=todayTid; state.session=todaySession;
    storageSet(LS.tab,todayTid); storageSet(LS.session,todaySession);
  }
  storageSet(LS.lastOpen,next.key);
  return dayChanged;
}
syncTodayWorkout();
function resumeApp(){
  if(document.hidden) return;
  const changed=syncTodayWorkout();
  if(changed) render();
  if(tInt&&!tFinished) tickTimer();
  requestWakeLock(); refreshAppNotice();
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden) releaseWakeLock(); else resumeApp(); });
window.addEventListener('pageshow',resumeApp);
window.addEventListener('pagehide',()=>autoBackupIfDue(true));
window.addEventListener('storage',ev=>{
  const editing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);
  if(!ev.newValue||editing) return;
  if(ev.key===LS.data){ const latest=decodeData(ev.newValue,false); if(latest.valid){ state.data=latest.data; render(); } return; }
  if(ev.key===LS.measurements){ state.measurements=normalizeMeasurements(parseStoredJson(LS.measurements,[])); render(); return; }
  if(ev.key===LS.settings){ state.settings=normalizeSettings(parseStoredJson(LS.settings,{})); document.body.classList.toggle('large-text',state.settings.largeText); render(); }
});
document.addEventListener('pointerdown',()=>{ primeAudio(); requestWakeLock(); }, {once:true});
document.addEventListener('keydown',advanceNumericField);
window.addEventListener('online',refreshAppNotice); window.addEventListener('offline',refreshAppNotice);
render();
autoBackupIfDue();
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloadingForUpdate) return; reloadingForUpdate=true; location.reload(); });
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(watchRegistration).catch(()=>{}));
}
refreshAppNotice();
</script>
